# Pi-hole Statistik fuer die Standalone-Karte (Variante B)
# Ablegen als /config/packages/pihole_auswertung.yaml
# Das Skript /config/pihole_stats.py liest pihole_url und pihole_app_password aus der secrets.yaml.
command_line:
  - sensor:
      name: Pi-hole Statistik
      unique_id: pihole_statistik_json
      command: "python3 /config/pihole_stats.py"
      scan_interval: 60
      command_timeout: 30
      value_template: "{{ value_json.total }}"
      state_class: measurement
      json_attributes:
        - blocked
        - percent_blocked
        - cached
        - forwarded
        - unique_domains
        - frequency
        - clients_active
        - clients_total
        - domains_on_lists
        - gravity_last_update
        - query_types
        - upstreams
        - top_domains
        - top_blocked
        - top_clients
        - top_clients_blocked
        - hist_start
        - hist_cached
        - hist_forwarded
        - hist_total
        - hist_blocked
